# Пример: один диск, корень зашифрован ключ-файлом, пакеты из репозитория evillin.
# Проверить без изменений: moonshine-install check moonshine.toml --plan
# Установить:              moonshine-install --config moonshine.toml

disk     = "/dev/sda"               # этот диск будет СТЁРТ
hostname = "moonshine"
timezone = "Europe/Moscow"
keyfile  = true                     # ключ корня в initramfs: пароль при загрузке не нужен

[[repository]]
id      = "evillin"
baseurl = "https://repo.evillin.online/$basearch/"
gpgkey  = "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-evillin"

[[users]]
name = "root"
hash = "$6$salt$replace-with-real-hash"   # хеш пароля: openssl passwd -6

[[users]]
name = "alice"
hash = "$6$salt$replace-with-real-hash"

[system]
network = "dhcp"                    # сеть в установленной системе
